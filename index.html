<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shoot3D – Tembak Objek Melayang</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="hud" hidden>
  <span>⭐ <b id="sc">0</b></span><span>⏱ <b id="tm">0</b></span><span>🔥 x<b id="cb">0</b></span><span>🏆 <b id="bs">0</b></span>
  <button id="quit">✕</button>
</div>
<div id="menu" class="panel">
  <h1>🎯 Shoot3D</h1>
  <h3>Objek Target</h3><div id="themes" class="row"></div>
  <label class="up">🖼️ Upload gambar sendiri (bisa banyak)<input id="file" type="file" accept="image/*" multiple hidden></label>
  <h3>Senjata</h3><div id="weapons" class="row"></div>
  <h3>Level</h3><div id="levels" class="row"></div>
  <button id="start" class="go">MULAI</button>
  <p class="tip">Klik / tap objek untuk menembak.</p>
</div>
<div id="end" class="panel" hidden>
  <h1 id="endt"></h1><p>Poin: <b id="es"></b> · Terbaik: <b id="eb"></b></p>
  <button id="again" class="go">Main Lagi</button><button id="home" class="chip">Menu</button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
