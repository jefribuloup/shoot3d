<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1630">
<meta name="description" content="Shoot3D – game tembak objek melayang 3D langsung di browser. Pilih objek, senjata, dan level, lalu kejar skor tertinggi!">
<title>Shoot3D – Tembak Objek Melayang</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="lcard">
    <div class="spin">
      <div class="ring r1"></div><div class="ring r2"></div>
      <div class="orbit"><i>🍎</i><i>📚</i><i>🐟</i></div>
      <div class="core">🎯</div>
    </div>
    <div class="ltitle">Shoot<span>3D</span></div>
    <div id="ltxt">Memuat game</div>
    <div id="lbar"><i></i></div>
    <button id="lreload" onclick="location.reload()">↻ Muat Ulang</button>
  </div>
</div>
<script>setTimeout(function(){var l=document.getElementById('loader');if(l&&!window.__ready&&!l.classList.contains('fail')){l.classList.add('fail');document.getElementById('ltxt').textContent='Memuat terlalu lama. Periksa koneksi internet lalu muat ulang.'}},15000)</script>
<canvas id="c"></canvas>
<div id="cross"></div>

<div id="hud" hidden>
  <span class="pill">⭐ <b id="sc">0</b></span>
  <span class="pill">⏱ <b id="tm">0</b></span>
  <span class="pill">🔥 x<b id="cb">0</b></span>
  <span class="pill dim">🏆 <b id="bs">0</b></span>
  <button id="quit" title="Keluar ke menu">✕</button>
</div>

<div id="menu" class="panel">
  <div class="bg" aria-hidden="true"><i>🍎</i><i>📚</i><i>🐟</i><i>🔨</i><i>🥕</i><i>🖊️</i></div>
  <div class="card">
    <header>
      <div class="logo">🎯</div>
      <h1>Shoot<span>3D</span></h1>
      <p class="sub">Tembak objek melayang, kejar combo, dan jadi nomor satu!</p>
    </header>

    <section><h3><em>1</em> Nama Pemain</h3>
      <input id="name" class="name" maxlength="20" placeholder="Ketik namamu…" autocomplete="off"></section>

    <section><h3><em>2</em> Objek Target <small>boleh pilih lebih dari satu</small></h3>
      <div id="themes" class="row"></div>
      <label class="up">🖼️ Upload gambar sendiri<small>bisa banyak file</small><input id="file" type="file" accept="image/*" multiple hidden></label></section>

    <section><h3><em>3</em> Senjata</h3><div id="weapons" class="row"></div></section>
    <section><h3><em>4</em> Level</h3><div id="levels" class="row"></div></section>

    <button id="start" class="go">▶ MULAI MAIN</button>
    <p class="tip">🖱️ Klik / tap objek untuk menembak · 🏆 Skor tersimpan online</p>
  </div>
</div>

<div id="end" class="panel" hidden>
  <div class="bg" aria-hidden="true"><i>💥</i><i>⭐</i><i>🎯</i><i>🏆</i></div>
  <div class="card small">
    <h1 id="endt"></h1>
    <div class="stats"><div><small>Poin</small><b id="es"></b></div><div><small>Terbaik</small><b id="eb"></b></div></div>
    <h3>🏆 Papan Peringkat</h3>
    <ol id="lb"></ol>
    <div class="btns"><button id="again" class="go">↻ Main Lagi</button><button id="home" class="chip">☰ Menu</button></div>
  </div>
</div>

<div id="err" hidden></div>
<script type="module" src="js/main.js?v=4" onerror="var l=document.getElementById('loader');l.classList.add('fail');document.getElementById('ltxt').textContent='Gagal memuat file game. Periksa koneksi lalu muat ulang.'"></script>
</body>
</html>
